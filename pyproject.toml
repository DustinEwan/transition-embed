[project]
name = "transition-embed"
version = "0.1.0"
description = "Train a fixed, reusable, tied binary codebook whose bits encode short-range next-token transition structure (not similarity). Backbone-agnostic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.12.0",
]

[project.optional-dependencies]
# for the examples/ (wikitext training, Qwen3 tokenizer)
examples = [
    "datasets>=2.20.0",
    "transformers>=4.57.6",
    "fire>=0.7.1",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transition_embed"]
